<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داگرتنی دەنگی یوتوب</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-6 rounded-2xl shadow-xl text-center max-w-sm w-full mx-4">
        <h1 class="text-2xl font-bold mb-6 text-red-600">گۆڕینی ڤیدیۆ بۆ دەنگ</h1>
        
        <input id="yt-link" type="text" placeholder="لینکەکەی یوتوب لێرە دابنێ..." 
               class="w-full p-3 border-2 border-gray-200 rounded-xl mb-4 text-left focus:border-red-500 focus:outline-none transition-colors" dir="ltr">
        
        <button id="download-btn" onclick="downloadAudio()" 
                class="w-full bg-red-600 text-white p-3 rounded-xl font-bold text-lg hover:bg-red-700 transition-colors shadow-md">
            ئامادەکردنی دەنگەکە
        </button>
        
        <p id="status" class="mt-4 text-gray-600 font-bold text-sm"></p>
    </div>

    <script>
        async function downloadAudio() {
            let link = document.getElementById("yt-link").value.trim();
            let statusText = document.getElementById("status");
            let btn = document.getElementById("download-btn");

            if (!link) {
                alert("تکایە سەرەتا لینکێک دابنێ!");
                return;
            }
            
            // گۆڕینی شێوەی دوگمەکە لە کاتی کارکردندا
            statusText.innerText = "کەمێک چاوەڕێ بکە، خەریکی هێنانی دەنگەکەیە...";
            statusText.style.color = "blue";
            btn.disabled = true;
            btn.style.opacity = "0.5";

            try {
                // ناردنی داواکاری بۆ APIـیە پاکەکەی کۆباڵت
                let response = await fetch("https://api.cobalt.tools/api/json", {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        url: link,
                        isAudioOnly: true
                    })
                });

                let data = await response.json();

                // ئەگەر لینکەکە ئامادە بوو، ڕاستەوخۆ دەست دەکات بە داگرتن
                if (data.url) {
                    statusText.innerText = "سەرکەوتوو بوو! فایلەکە دادەبەزێت.";
                    statusText.style.color = "green";
                    window.location.href = data.url; 
                } else {
                    statusText.innerText = "هەڵەیەک ڕوویدا، تکایە دڵنیابەوە لە لینکەکە.";
                    statusText.style.color = "red";
                }
            } catch (error) {
                statusText.innerText = "کێشەیەک هەیە لە سێرڤەرەوە.";
                statusText.style.color = "red";
            }

            // گەڕاندنەوەی دوگمەکە بۆ باری ئاسایی
            btn.disabled = false;
            btn.style.opacity = "1";
        }
    </script>
</body>
</html>
