<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داگرتنی دەنگی یوتوب</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-6 rounded-2xl shadow-xl text-center max-w-sm w-full mx-4">
        <h1 class="text-2xl font-bold mb-2 text-red-600">گۆڕینی ڤیدیۆ بۆ دەنگ</h1>
        <p class="text-gray-500 mb-6 text-sm">بەبێ کێشەی سێرڤەر کار دەکات بۆ ڤیدیۆ و کورتە (Shorts)</p>
        
        <input id="yt-link" type="text" placeholder="لینکەکەی یوتوب (یان Shorts) لێرە دابنێ..." 
               class="w-full p-3 border-2 border-gray-200 rounded-xl mb-4 text-left focus:border-red-500 focus:outline-none transition-colors" dir="ltr">
        
        <!-- دوگمەی یەکەم -->
        <button onclick="downloadVia('yout')" 
                class="w-full bg-red-600 text-white p-3 rounded-xl font-bold text-lg hover:bg-red-700 transition-colors shadow-md mb-3">
            داگرتن (سێرڤەری یەکەم - خێرا)
        </button>

        <!-- دوگمەی دووەم -->
        <button onclick="downloadVia('y2meta')" 
                class="w-full bg-gray-800 text-white p-3 rounded-xl font-bold text-lg hover:bg-gray-900 transition-colors shadow-md">
            داگرتن (سێرڤەری دووەم - یەدەگ)
        </button>
        
        <p id="status" class="mt-4 text-red-600 font-bold text-sm"></p>
    </div>

    <script>
        // دۆزینەوەی ئایدی ڤیدیۆکە لە هەموو جۆرە لینکێک (تەنانەت Shorts)
        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function downloadVia(server) {
            const link = document.getElementById("yt-link").value.trim();
            const statusText = document.getElementById("status");
            
            if (!link) {
                statusText.innerText = "تکایە سەرەتا لینکێک دابنێ!";
                return;
            }

            const videoId = extractVideoID(link);
            
            if (!videoId) {
                statusText.innerText = "لینکەکە هەڵەیە، تکایە لینکی دروستی یوتوب دابنێ.";
                return;
            }

            statusText.innerText = "ئامادەیە! ڕاستەوخۆ دەتبەینە پەڕەی داگرتن...";
            statusText.style.color = "green";

            // گۆڕینی لینکەکە بۆ لینکی فەرمی یوتوب بۆ ئەوەی سێرڤەرەکان بلۆکی نەکەن
            const cleanYoutubeLink = `https://www.youtube.com/watch?v=${videoId}`;

            if (server === 'yout') {
                // سێرڤەری Yout: زۆر خێرایە و ڕاستەوخۆ بەشی دەنگ (MP3) دەکاتەوە
                window.location.href = `https://yout.com/video/?url=${encodeURIComponent(cleanYoutubeLink)}`;
            } else if (server === 'y2meta') {
                // سێرڤەری Y2Meta: وەک یەدەگ ئەگەر ئەوەی یەکەم قەرەباڵغ بوو
                window.location.href = `https://y2meta.mobi/youtube/${videoId}`;
            }
        }
    </script>
</body>
</html>
