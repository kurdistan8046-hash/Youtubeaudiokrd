<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داگرتنی دەنگی یوتوب</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-6 rounded-2xl shadow-xl text-center max-w-sm w-full mx-4">
        <h1 class="text-2xl font-bold mb-6 text-red-600">گۆڕینی ڤیدیۆ بۆ دەنگ</h1>
        
        <input id="yt-link" type="text" placeholder="لینکەکەی یوتوب لێرە دابنێ..." 
               class="w-full p-3 border-2 border-gray-200 rounded-xl mb-4 text-left focus:border-red-500 focus:outline-none transition-colors" dir="ltr">
        
        <button onclick="downloadAudio()" 
                class="w-full bg-red-600 text-white p-3 rounded-xl font-bold text-lg hover:bg-red-700 transition-colors shadow-md">
            ئامادەکردنی دەنگەکە
        </button>
    </div>

    <script>
        function downloadAudio() {
            let link = document.getElementById("yt-link").value.trim();
            if (!link) {
                alert("تکایە سەرەتا لینکێک دابنێ!");
                return;
            }
            
            // لێرەدا گۆڕانکارییەکەمان کرد، ڕاستەوخۆ دەتباتە پەڕەی داگرتنەکە بۆ ئەوەی بلۆک نەکرێت
            let downloadUrl = `https://loader.to/api/button/?url=${encodeURIComponent(link)}&f=mp3`;
            window.location.href = downloadUrl;
        }
    </script>
</body>
</html>
