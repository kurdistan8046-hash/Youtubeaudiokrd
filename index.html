<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داگرتنی دەنگی یوتوب</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-6 rounded-2xl shadow-xl text-center max-w-sm w-full mx-4">
        <h1 class="text-2xl font-bold mb-6 text-red-600">گۆڕینی ڤیدیۆ بۆ دەنگ</h1>
        
        <input id="yt-link" type="text" placeholder="لینکەکەی یوتوب لێرە دابنێ..." 
               class="w-full p-3 border-2 border-gray-200 rounded-xl mb-4 text-left focus:border-red-500 focus:outline-none transition-colors" dir="ltr">
        
        <button id="download-btn" onclick="downloadAudio()" 
                class="w-full bg-red-600 text-white p-3 rounded-xl font-bold text-lg hover:bg-red-700 transition-colors shadow-md">
            ئامادەکردنی دەنگەکە
        </button>
        
        <p id="status" class="mt-4 text-gray-600 font-bold text-sm"></p>
    </div>

    <script>
        async function downloadAudio() {
            const link = document.getElementById("yt-link").value.trim();
            const statusText = document.getElementById("status");
            const btn = document.getElementById("download-btn");
            
            if (!link) {
                alert("تکایە سەرەتا لینکێک دابنێ!");
                return;
            }

            statusText.innerText = "١. خەریکی وەرگرتنی ڤیدیۆکەیە...";
            statusText.style.color = "blue";
            btn.disabled = true;
            btn.style.opacity = "0.5";

            try {
                // هەوڵدان بۆ داگرتنی ڕاستەوخۆ بەبێ کلیل
                const res = await fetch(`https://p.oceansaver.in/ajax/download.php?format=mp3&url=${encodeURIComponent(link)}`);
                const data = await res.json();

                if (data && data.success && data.id) {
                    const fileId = data.id;
                    statusText.innerText = "٢. ڤیدیۆکە دەگۆڕێت بۆ دەنگ، کەمێک چاوەڕێ بکە...";

                    // پشکنین بۆ ئەوەی بزانین کەی ئامادە دەبێت
                    const checkInterval = setInterval(async () => {
                        try {
                            const progressRes = await fetch(`https://p.oceansaver.in/ajax/progress.php?id=${fileId}`);
                            const progressData = await progressRes.json();

                            if (progressData && progressData.success) {
                                if (progressData.progress === 1000) {
                                    clearInterval(checkInterval);
                                    statusText.innerText = "٣. ئامادەیە! ئێستا دادەبەزێت...";
                                    statusText.style.color = "green";
                                    
                                    // کاتێک ئامادە بوو، ڕاستەوخۆ فایلەکە دادەبەزێنێت
                                    window.location.href = progressData.download_url;
                                    
                                    btn.disabled = false;
                                    btn.style.opacity = "1";
                                } else {
                                    statusText.innerText = `٢. خەریکە دەگۆڕێت: ${Math.round(progressData.progress / 10)}%`;
                                }
                            }
                        } catch (err) {
                            clearInterval(checkInterval);
                            throw new Error("کێشە لەکاتی گۆڕیندا ڕوویدا");
                        }
                    }, 3000);
                } else {
                    throw new Error("سێرڤەر وەڵامی نەدایەوە");
                }
            } catch (error) {
                // پلانی بی: ئەگەر سێرڤەرەکە کێشەی هەبوو، ناهێڵێت پڕۆگرامەکە بوەستێت
                // ڕاستەوخۆ دەتباتە ماڵپەڕێکی سەد لە سەد پاک کە لینکەکەی تۆی تێدا ئامادەیە
                statusText.innerText = "سێرڤەری سەرەکی خاوە، ڕاستەوخۆ دەتبەینە پەڕەی داگرتن...";
                statusText.style.color = "orange";
                
                setTimeout(() => {
                    window.location.href = `https://cobalt.tools/?u=${encodeURIComponent(link)}`;
                }, 2000);
            }
        }
    </script>
</body>
</html>
